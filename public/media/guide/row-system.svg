<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rs-title rs-desc">
  <title id="rs-title">Four voices, seven coprime series each</title>
  <desc id="rs-desc">Each voice runs seven independent series -- pitch (576 steps) plus register, duration, dynamics, envelope, pan and ornament (5, 7, 11, 13, 17 and 19 steps) -- none dividing another, so the combined state of all four voices does not repeat for roughly 931 million events.</desc>
  <rect width="700" height="420" fill="#f2f1f5"/>
  <text x="350" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#12121a">Four voices, seven coprime series each</text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a5a6b">
    <text x="120" y="66" text-anchor="middle">Pitch</text>
    <text x="220" y="66" text-anchor="middle">Register</text>
    <text x="300" y="66" text-anchor="middle">Duration</text>
    <text x="380" y="66" text-anchor="middle">Dynamics</text>
    <text x="460" y="66" text-anchor="middle">Envelope</text>
    <text x="540" y="66" text-anchor="middle">Pan</text>
    <text x="610" y="66" text-anchor="middle">Ornament</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5a5a6b">
    <text x="120" y="80" text-anchor="middle">576 steps</text>
    <text x="220" y="80" text-anchor="middle">5</text>
    <text x="300" y="80" text-anchor="middle">7</text>
    <text x="380" y="80" text-anchor="middle">11</text>
    <text x="460" y="80" text-anchor="middle">13</text>
    <text x="540" y="80" text-anchor="middle">17</text>
    <text x="610" y="80" text-anchor="middle">19</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <text x="20" y="118" fill="#e4572e">Voice 1</text>
    <circle cx="120" cy="112" r="14" fill="none" stroke="#e4572e" stroke-width="2"/>
    <circle cx="220" cy="112" r="6"  fill="#e4572e"/>
    <circle cx="300" cy="112" r="7"  fill="#e4572e"/>
    <circle cx="380" cy="112" r="8"  fill="#e4572e"/>
    <circle cx="460" cy="112" r="9"  fill="#e4572e"/>
    <circle cx="540" cy="112" r="10" fill="#e4572e"/>
    <circle cx="610" cy="112" r="11" fill="#e4572e"/>

    <text x="20" y="188" fill="#29b6a8">Voice 2</text>
    <circle cx="120" cy="182" r="14" fill="none" stroke="#29b6a8" stroke-width="2"/>
    <circle cx="220" cy="182" r="6"  fill="#29b6a8"/>
    <circle cx="300" cy="182" r="7"  fill="#29b6a8"/>
    <circle cx="380" cy="182" r="8"  fill="#29b6a8"/>
    <circle cx="460" cy="182" r="9"  fill="#29b6a8"/>
    <circle cx="540" cy="182" r="10" fill="#29b6a8"/>
    <circle cx="610" cy="182" r="11" fill="#29b6a8"/>

    <text x="20" y="258" fill="#f3a712">Voice 3</text>
    <circle cx="120" cy="252" r="14" fill="none" stroke="#f3a712" stroke-width="2"/>
    <circle cx="220" cy="252" r="6"  fill="#f3a712"/>
    <circle cx="300" cy="252" r="7"  fill="#f3a712"/>
    <circle cx="380" cy="252" r="8"  fill="#f3a712"/>
    <circle cx="460" cy="252" r="9"  fill="#f3a712"/>
    <circle cx="540" cy="252" r="10" fill="#f3a712"/>
    <circle cx="610" cy="252" r="11" fill="#f3a712"/>

    <text x="20" y="328" fill="#a8c686">Voice 4</text>
    <circle cx="120" cy="322" r="14" fill="none" stroke="#a8c686" stroke-width="2"/>
    <circle cx="220" cy="322" r="6"  fill="#a8c686"/>
    <circle cx="300" cy="322" r="7"  fill="#a8c686"/>
    <circle cx="380" cy="322" r="8"  fill="#a8c686"/>
    <circle cx="460" cy="322" r="9"  fill="#a8c686"/>
    <circle cx="540" cy="322" r="10" fill="#a8c686"/>
    <circle cx="610" cy="322" r="11" fill="#a8c686"/>
  </g>

  <line x1="20" y1="360" x2="680" y2="360" stroke="#12121a" stroke-opacity="0.1"/>
  <text x="350" y="390" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#12121a">No period divides another -- so all four voices together</text>
  <text x="350" y="410" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#12121a">don't repeat for &#8776; 931 million events</text>
</svg>
