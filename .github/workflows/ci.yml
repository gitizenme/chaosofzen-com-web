name: CI

# Documentation and the design generator do not change what ships. `verify`
# builds the site and runs the full Playwright suite including an axe sweep of
# every page, which is not worth doing for a README edit.
#
# src/content/** is deliberately NOT ignored even though it is Markdown: the
# changelog entries under it ARE site content, and skipping CI on them would
# mean shipping unchecked pages.
#
# design/** holds the mark generator, which produces committed assets but does
# not ship. A change there that also updates public/ triggers CI via public/.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'design/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
  push:
    branches: [main]
    paths-ignore:
      - 'design/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm astro check
      - run: pnpm vitest run
      # The same command the deploy runs: wrangler.jsonc's build.command is
      # `pnpm build`. This step was `pnpm astro build` for a while because
      # `pnpm build` was `check-products.mjs && astro build`, and that guard
      # refused outright while Ekphrasis's variantId was the placeholder --
      # every PR red for a reason unrelated to the change under review, which
      # is how a suite gets ignored. The guard has since moved into the pages
      # (src/lib/products.ts's isPurchasable), so `pnpm build` succeeds and CI
      # can exercise the real thing again. Building something other than what
      # deploys is how a deploy-only failure gets discovered in production.
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test

  deploy-staging:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # wrangler.jsonc's build.command runs `pnpm build`, so deploy builds too.
      - run: pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
